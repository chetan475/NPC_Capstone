# =============================================================
# Debian 13 (trixie) preseed — Malware Analysis Sandbox lab VM
# Unattended install from netinst CD, NO network mirror,
# network = VMware host-only VMnet1 (no internet by design).
# =============================================================

# --- Localization ---
d-i debian-installer/locale string en_US
d-i keyboard-configuration/xkb-keymap select us

# --- Network: static on host-only subnet 192.168.116.0/24 ---
d-i netcfg/disable_autoconfig boolean true
d-i netcfg/dhcp_failed note
d-i netcfg/dhcp_options select Configure network manually
d-i netcfg/get_ipaddress string 192.168.116.200
d-i netcfg/get_netmask string 255.255.255.0
d-i netcfg/get_gateway string 192.168.116.1
d-i netcfg/get_nameservers string 192.168.116.1
d-i netcfg/confirm_static boolean true
d-i netcfg/get_hostname string malware-lab
d-i netcfg/get_domain string lab.local
d-i netcfg/hostname string malware-lab

# --- Clock: UTC, no NTP (VM has no internet) ---
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean false

# --- Accounts (FAKE lab credentials only) ---
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password $6$wqBT2Jz2Bo17n7X6$6xgz6i7s.B2uRnd/SO4QCQUIppJhd66AXlCF3705yXMrhlOiQhDxd/0qraDbrKokCIxEU2KHrM845Y4KYjFvn0
d-i passwd/user-fullname string Lab User
d-i passwd/username string labuser
d-i passwd/user-password-crypted password $6$wqBT2Jz2Bo17n7X6$6xgz6i7s.B2uRnd/SO4QCQUIppJhd66AXlCF3705yXMrhlOiQhDxd/0qraDbrKokCIxEU2KHrM845Y4KYjFvn0
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

# --- APT: use CD only, no network mirror, no security repo ---
d-i apt-setup/services-select multiselect none
d-i apt-setup/use_mirror boolean false
d-i apt-setup/non-free boolean false
d-i apt-setup/non-free-firmware boolean false
d-i apt-setup/contrib boolean false
d-i apt-setup/enable-source-repositories boolean false
popularity-contest popularity-contest/participate boolean false
d-i pkgsel/upgrade select none

# --- Packages: SSH task for analyst access + inspection tooling ---
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server python3 procps less

# --- Boot loader ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string /dev/sda

# --- Disk: single whole-disk partition (12 GB growable vmdk) ---
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# --- Firmware / misc ---
d-i hw-detect/load_firmware boolean false
d-i debian-installer/splash boolean false
d-i cdrom-detect/eject boolean false
d-i finish-install/keep-consoles boolean false
d-i finish-install/reboot_in_progress note

# --- Late commands: inject analyst key + harden network config ---
# Remove gateway and DNS from installed system -> demonstrably NO route
# to the internet after boot, while host <-> guest SSH still works.
d-i preseed/late_command string \
  mkdir -p /target/root/.ssh ; \
  cp /cdrom/authorized_keys /target/root/.ssh/authorized_keys ; \
  chmod 700 /target/root/.ssh ; \
  chmod 600 /target/root/.ssh/authorized_keys ; \
  chown root:root /target/root/.ssh /target/root/.ssh/authorized_keys ; \
  sed -i '/gateway/d' /target/etc/network/interfaces ; \
  sed -i '/dns-nameservers/d' /target/etc/network/interfaces ; \
  rm -f /target/etc/resolv.conf ; \
  touch /target/etc/resolv.conf ; \
  echo 'root@malware-lab' > /target/root/.ssh/lab-note.txt ; \
  in-target systemctl enable ssh
